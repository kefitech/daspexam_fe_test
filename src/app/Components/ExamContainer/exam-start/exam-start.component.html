<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav position="end" class="SideNav" mode="side" [(opened)]="sideNav">
        <!-- Timer -->
        <div class="col-sm-12 mt-3 Time d-flex justify-content-center">
            <countdown #cd1 [config]="timerConfig" (event)="handleEvent($event)"></countdown>
        </div>

        <!-- explanation about status -->
        <div class="col-sm-12">
            <div class="row px-4 py-1">
                <button class="NotVisited my-fab" mat-mini-fab>!</button>
                <span class="pl-2 Info">Marked as Not Visited</span>
            </div>

            <div class="row px-4 py-1">
                <button class="Visited my-fab" mat-mini-fab>!</button>
                <span class="pl-2 Info">Marked as Visited</span>
            </div>

            <div class="row px-4 py-1">
                <button class="Answered my-fab" mat-mini-fab>!</button>
                <span class="pl-2 Info">Marked as Answered</span>
            </div>
            <div class="row px-4 py-1">
                <button class="Review my-fab" mat-mini-fab>!</button>
                <span class="pl-2 Info">Marked as Review</span>
            </div>
        </div>

        <!-- Question Navigation -->
        <div class="col-sm-12 mt-4 QuestionPagination">
            <div class="row px-3 QuestionNo">
                Choose a Question
            </div>
            <div class="row p-2">
                <div class="col-sm-3 p-2" *ngFor="let exam of examinationData; let i=index">
                    <button [matTooltip]="exam?.question?.status==0?'Not Visited':(exam?.question?.status==1?
                        'Visited':exam?.question?.status==2?'Answered':'Marked For Review')" [ngClass]="{'NotVisited': exam?.question?.status==0, 'Visited': exam?.question?.status==1, 
                'Answered': (exam?.question?.status==2), 'Review': (exam?.question?.status==3)}"
                        (click)="GotoQuestion(i)" mat-mini-fab>{{i+1}}</button>
                </div>

            </div>
        </div>

        <!-- submit button -->
        <div class="col-sm-12">
            <button (click)="Submit()" mat-raised-button class=" col-sm-12 Submit">Submit</button>
        </div>


    </mat-sidenav>
    <mat-sidenav-content>
        <div class="container">
            <div class="col-sm-12"
                *ngFor="let exam of examinationData; let i=index; let first = first; let last = last">
                <div class="row mt-3 QuestionNo" *ngIf="i==activeIndex">
                    Question No: {{i+1}}
                </div>
                <div class="row mt-4 Question" *ngIf="i==activeIndex">
                    <div [ngClass]="{'col-sm-12': !exam?.question?.isImage, 'col-sm-8': exam?.question?.isImage}"
                        [innerHtml]="exam?.question?.question">
                        <!-- Questions available here -->
                    </div>
                    <div class="col-sm-4">
                        <img class="rounded QuestionImage" [src]="exam?.question?.imageUrl" alt="">
                    </div>
                </div>
                <div class="row mt-5" *ngIf="i==activeIndex">
                    <div class="col-sm-3" *ngFor="let options of exam?.options; let j=index">
                        <mat-radio-button color="primary" [checked]="options?.marked"
                            (change)="Answer(i, j, exam?.question?.questionId, options?.optionId, $event)"
                            [value]="options?.optionId">
                            <span *ngIf="!options?.isImage" [innerHtml]="options?.option">
                                <!-- Options available here -->
                            </span>
                            <img *ngIf="options?.isImage" class="rounded AnswerImage" [src]="options?.option" alt="">
                        </mat-radio-button>
                    </div>
                </div>
                <div class="row mt-5" *ngIf="i==activeIndex">
                    <div class="col-sm-8">
                        <button (click)="MarkASReview(i, exam?.question?.status)" class="MarkReview" mat-raised-button>
                            <span *ngIf="exam?.question?.status!=3">Mark as review</span>
                            <span *ngIf="exam?.question?.status==3">Reviewed</span>
                        </button>
                    </div>
                    <div class="col-sm-2">
                        <button matTooltip="Previous" *ngIf="!first" (click)="Navigate('previous', i, first, last)"
                            class="Submit" mat-flat-button>
                            <span>Previous</span>
                            <!-- <mat-icon *ngIf="!first">
                                keyboard_arrow_left
                            </mat-icon> -->
                        </button>
                    </div>
                    <div class="col-sm-2">
                        <button [matTooltip]="last?'Save':'Save and Next'" (click)="Navigate('next', i, first, last)"
                            class="Submit" mat-flat-button>
                            <span *ngIf="!last">Save and Next</span>
                            <span *ngIf="last">Save</span>
                            <!-- <mat-icon *ngIf="!last">
                                keyboard_arrow_right
                            </mat-icon>
                            <mat-icon *ngIf="last">
                                save
                            </mat-icon> -->
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
