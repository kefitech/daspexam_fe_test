<div class="col-sm-12">
    <div class="row">
        <mat-toolbar class="ToolBar">
            <mat-toolbar-row>
                <img class="LogoImg" [src]="logo?.img" alt="logo?.alt">
                <span class="ml-3 w-100">DASP Examination</span>
                <span *ngIf="(dataService?.isNotLoginScreen | async)" class="d-flex justify-content-end p-3">
                    <img class="userImg rounded-circle" [src]="(dataService?.studentData | async)?.photo"
                        alt="user avatar">
                    <span class="userName p-2">{{(dataService?.studentData | async)?.fullName}}</span>
                    <!-- <button matTooltip="Full Screen" *ngIf="(dataService?.warning | async)" (click)="toggleFullScreen()" mat-icon-button color="accent">
                            <mat-icon>settings_overscan</mat-icon>
                        </button> -->
                </span>
                <button *ngIf="(dataService?.sideNavButton | async)" class="float-right" matTooltip="Show/Hide"
                    (click)="sideNavToggle()" mat-icon-button color="primary">
                    <mat-icon>menu</mat-icon>
                </button>
                <span *ngIf="(dataService?.controllerLogin | async)">
                    {{(dataService?.controllerData | async)?.controllerMail}}
                </span>

                <button matTooltip="More" *ngIf="(dataService?.controllerLogin | async)" mat-icon-button [matMenuTriggerFor]="menu">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                <mat-menu #menu="matMenu">
                    <button (click)="LogoutController()" mat-menu-item>Logout</button>
                </mat-menu>
            </mat-toolbar-row>
        </mat-toolbar>
    </div>
    <router-outlet></router-outlet>
</div>
