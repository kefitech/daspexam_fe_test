module.exports = "<div class=\"col-sm-12\">\n    <!-- <div class=\"row d-flex justify-content-center Heading\">\n        Enter Hallticket Number\n    </div> -->\n    <form [formGroup]=\"hallticketForm\" (ngSubmit)=\"Submit()\">\n        <div class=\"row\">\n            <mat-form-field appearance=\"outline\" class=\"FormField\">\n                <mat-label>{{formCaption?.caption1}}</mat-label>\n                <input readonly (keypress)=\"_keyPress($event)\" formControlName=\"hallTicketNumber\" matInput\n                    [placeholder]=\"formCaption?.caption1\">\n                <button style=\"outline: none !important;\" (click)=\"ResetMenu()\" matTooltip=\"Virtual Keyboard\" matSuffix\n                    type=\"button\" [matMenuTriggerFor]=\"menu\" mat-icon-button>\n                    <mat-icon>keyboard</mat-icon>\n                </button>\n                <mat-error *ngIf=\"hallticketForm.get('hallTicketNumber').hasError('required')\">\n                    {{error?.required}}\n                </mat-error>\n            </mat-form-field>\n            <mat-menu #menu=\"matMenu\">\n                <div class=\"col-sm-12 py-1\" (click)=\"$event.stopPropagation();\">\n                    <div class=\"row\">\n                        <div class=\"col-sm-3 py-1 d-flex justify-content-center\" *ngFor=\"let value of keyboardValue\">\n                            <button (click)=\"InputChange(value) ; $event.stopPropagation()\" type=\"button\"\n                                mat-stroked-button>{{value}}</button>\n                        </div>\n                    </div>\n                    <div class=\"row\">\n                        <div class=\"col-sm-3 d-flex justify-content-center\">\n                            <button [matTooltip]=\"inputType == '123'?'Number': 'Character'\" type=\"button\"\n                                (click)=\"KeyboardTypeChange()\" mat-raised-button>{{inputType}}</button>\n                        </div>\n                        <div *ngIf=\"inputType == '123'\" class=\"col-sm-3 d-flex justify-content-center\">\n                            <button [matTooltip]=\"upperCase?'Lowercase': 'Uppercase'\"\n                                [color]=\"upperCase?'primary': null\" type=\"button\" (click)=\"LowerUperCaseChange()\"\n                                mat-raised-button>\n                                <mat-icon>arrow_upward</mat-icon>\n                            </button>\n                        </div>\n                        <!-- <div [ngClass]=\"{'col-sm-6': inputType != '123', 'col-sm-4': inputType == '123'}\">\n                            <button class=\"w-100\" type=\"button\" (click)=\"Space()\" mat-raised-button>\n                                <mat-icon>space_bar</mat-icon>\n                            </button>\n                        </div> -->\n                        <div class=\"col-sm-3 d-flex justify-content-center\">\n                            <button matTooltip=\"Backspace\" type=\"button\" (click)=\"Backspace()\" mat-raised-button>\n                                <mat-icon>backspace</mat-icon>\n                            </button>\n                        </div>\n                        <div class=\"col-sm-3 d-flex justify-content-center\">\n                            <button matTooltip=\"Clear\" type=\"button\" (click)=\"Clear()\" mat-raised-button>\n                                <mat-icon>clear</mat-icon>\n                            </button>\n                        </div>\n                    </div>\n\n                </div>\n            </mat-menu>\n        </div>\n        <div class=\"row\">\n            <mat-form-field appearance=\"outline\" class=\"FormField\">\n                <mat-label>{{formCaption?.caption2}}</mat-label>\n                <input style=\"cursor: pointer\" readonly matInput (click)=\"picker.open()\" [matDatepicker]=\"picker\"\n                    formControlName=\"birthDate\" [max]=\"maxDate\" [placeholder]=\"formCaption?.caption2\" required>\n                <mat-datepicker-toggle matSuffix [for]=\"picker\"></mat-datepicker-toggle>\n                <mat-datepicker #picker></mat-datepicker>\n                <mat-error *ngIf=\"hallticketForm.get('birthDate').hasError('required')\">\n                    {{error?.required}}\n                </mat-error>\n            </mat-form-field>\n        </div>\n        <div class=\"row d-flex justify-content-center\">\n            <div class=\"col-sm-8 pt-2\">\n                <button [disabled]=\"hallticketForm?.invalid\" class=\"Submit w-100\" mat-raised-button>Submit</button>\n            </div>\n        </div>\n    </form>\n</div>"
